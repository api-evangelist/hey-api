    description: >-
      @hey-api/openapi-ts is an OpenAPI to TypeScript code generator that emits
      production-grade SDKs, types, validators, query hooks, mocks and web
      framework handlers from any OpenAPI 2.0, 3.0 or 3.1 document. MIT
      licensed, over four million npm downloads a week, with a companion
      Python generator producing typed SDKs and Pydantic models. Consumed as a
      CLI, a Node API, a Vite plugin or a Nuxt module.
