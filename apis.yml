aid: hey-api
name: Hey API
description: >-
  Hey API builds open-source OpenAPI code generators and a hosted specification
  registry. @hey-api/openapi-ts turns an OpenAPI document into production-grade
  TypeScript — SDKs, types, Zod/Valibot/TypeBox validators, TanStack Query and
  SWR hooks, MSW and Playwright test doubles, and Fastify/NestJS/Hono/Express
  server handlers — across more than twenty plugins and eight HTTP client
  runtimes, with a sibling Python generator emitting Pydantic models. It draws
  over four million npm downloads a week and is used by Vercel, PayPal, AWS,
  Autodesk and OpenCode. The Hey API Platform (api.heyapi.dev) adds a
  build-attested registry: CI uploads each OpenAPI document with its repository,
  branch, commit and workflow provenance, and consumers resolve it back by
  branch, tag, version or exact commit for reproducible client generation.
