apis:
  - aid: hey-api:hey-api-platform
    name: Hey API Platform API
    description: >-
      The Hey API Platform REST backend. Stores OpenAPI specifications against
      an organization and project with full CI provenance (repository, branch,
      commit SHA, workflow, run, actor, tags, version), and serves them back
      through a filterable download endpoint that every codegen can consume
      directly. Also covers organization and membership management, project
      lifecycle, project and personal API keys, and project-scoped webhooks
      that fire on specification.created and specification.deleted. Thirty-eight
      operations published as OpenAPI 3.1.1; bearer API key for the registry
      endpoints, Clerk session JWT for management.
    humanURL: https://heyapi.dev/docs/openapi/typescript/integrations
