    meaning: The uploaded OpenAPI document exceeds the platform's accepted size.
    remediation: >-
      Reduce the document (bundle/dereference selectively) or contact Hey API.
      No published size ceiling exists — the limit is discoverable only by
      hitting it.
    occurrences: 1
    applies_to:
