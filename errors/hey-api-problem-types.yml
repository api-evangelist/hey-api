    meaning: >-
      The organization/project pair, or the specification/webhook id, does not
      exist or is not visible to the caller.
    remediation: >-
      Verify the organization_slug/project_slug pair. A private project
      requested anonymously surfaces here rather than as a 401.
    occurrences: 5
    applies_to:
