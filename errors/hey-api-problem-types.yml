problems:
  - status: 401
    title: Unauthorized
    meaning: >-
      Missing, malformed or unrecognized credential. On Clerk-secured
      operations this is also what an expired or absent session token returns
      (observed alongside the response header
      x-clerk-auth-reason: session-token-and-uat-missing).
    remediation: >-
      Send `Authorization: Bearer <api_key>` (platform key) or a valid Clerk
      session JWT. For spec upload the key must be a PROJECT key — personal
      keys are rejected.
    occurrences: 37
    applies_to: every secured operation
  - status: 403
    title: Forbidden
    meaning: >-
      Authenticated, but the caller is not permitted on this organization,
      project or record — or the credential is the wrong KIND (a personal API
      key attempting POST /v1/specifications).
    remediation: >-
      Check the caller's role on the organization
      (GET /v1/users/{user_id}/roles returns active | invited | suspended) and
      that the key belongs to the target project.
    occurrences: 29
  - status: 404
