      - GET /v1/organizations/{organization_slug}/projects/{project_slug}/specifications/{specification_id}
      - DELETE /v1/organizations/{organization_slug}/projects/{project_slug}/specifications/{specification_id}
      - GET /v1/organizations/{organization_slug}/projects/{project_slug}/webhooks/{webhook_id}
