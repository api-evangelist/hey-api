components:
  schemas:
    ApiKeyConcealed:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          example: '2025-02-21T02:37:15.840Z'
        creator_user_id:
          type:
          - string
          - 'null'
          format: uuid
          example: 5d2827a4-b3fc-4946-bb3b-72f23e89c6aa
        id:
          type: string
          format: uuid
          example: e4ce4324-1177-47ca-aeef-b1d011bd3932
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2025-02-21T02:37:15.840Z'
        updated_at:
          type: string
          format: date-time
          example: '2025-02-21T02:37:15.840Z'
      required:
      - created_at
      - creator_user_id
      - id
      - last_used_at
      - updated_at
    Waitlist:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          example: '2025-02-21T02:37:15.840Z'
        feature:
          $ref: '#/components/schemas/WaitlistFeature'
        id:
          type: string
          format: uuid
          example: e4ce4324-1177-47ca-aeef-b1d011bd3932
        tags:
          type: array
          items:
            type: string
          example:
          - typescript
        updated_at:
          type: string
          format: date-time
          example: '2025-02-21T02:37:15.840Z'
      required:
      - created_at
      - feature
      - id
      - tags
      - updated_at
    User:
      type: object
      properties:
        clerk_user_id:
          type:
          - string
          - 'null'
          example: user_2tDpMYgevIkZOL76Wo6VzXxsbxD
        created_at:
          type: string
          format: date-time
          example: '2025-02-21T02:37:15.840Z'
        email:
          type:
          - string
          - 'null'
          example: lubos@heyapi.dev
        first_name:
          type:
          - string
          - 'null'
          example: Lubos
        id:
          type: string
          format: uuid
          example: e4ce4324-1177-47ca-aeef-b1d011bd3932
        image_url:
          type:
          - string
          - 'null'
          example: https://img.clerk.com/eyJ0eXBlIjoicHJveHkiLCJzcmMiOiJodHRwczovL2ltYWdlcy5jbGVyay5kZXYvdXBsb2FkZWQvaW1nXzJ0RzFucjNDbzg2azhDTWNoUlBxTHViVEdtTiJ9
        last_name:
          type:
          - string
          - 'null'
          example: Menus
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        updated_at:
          type: string
          format: date-time
          example: '2025-02-21T02:37:15.840Z'
      required:
      - clerk_user_id
      - created_at
      - email
      - first_name
      - id
      - image_url
      - last_name
      - updated_at
    WaitlistFeature:
      type: string
      enum:
      - analytics
      - changelogs
      - integrations
      - mcp
      - mocks
      - sdks
      - tests
      example: sdks
    Role:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
          example: '2025-02-21T02:37:15.840Z'
        id:
          type: string
          format: uuid
          example: e4ce4324-1177-47ca-aeef-b1d011bd3932
        organization_id:
          type: string
          format: uuid
          example: e4ce4324-1177-47ca-aeef-b1d011bd3932
        status:
          type: string
          enum:
          - active
          - invited
          - suspended
          example: active
        updated_at:
          type: string
          format: date-time
          example: '2025-02-21T02:37:15.840Z'
        user_id:
          type: string
          format: uuid
          example: 5d2827a4-b3fc-4946-bb3b-72f23e89c6aa
      required:
      - created_at
      - id
      - organization_id
      - status
      - updated_at
      - user_id
    ApiKey:
      allOf:
      - $ref: '#/components/schemas/ApiKeyConcealed'
      - type: object
        properties:
          value:
            type: string
            example: xx_xxxx_xxxx_xxxxxxxxxxxxxxxxxxxxxxxx
        required:
        - value
    CursorResponse:
      type: object
      properties:
        end_cursor:
          type:
          - string
          - 'null'
          format: uuid
          example: e4ce4324-1177-47ca-aeef-b1d011bd3932
        has_next_page:
          type:
          - boolean
          - 'null'
          example: true
        has_previous_page:
          type:
          - boolean
          - 'null'
          example: true
        start_cursor:
          type:
          - string
          - 'null'
          format: uuid
          example: e4ce4324-1177-47ca-aeef-b1d011bd3932
      required:
      - end_cursor
      - has_next_page
      - has_previous_page
      - start_cursor
  securitySchemes:
    ApiKey:
      description: API key
      scheme: bearer
      type: http
    Clerk:
      bearerFormat: JWT
      description: Clerk JWT token
      scheme: bearer
      type: http
